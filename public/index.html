<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img id="brandLogo" alt="" hidden><span id="brandName">Store</span></a>
  </div>
</header>

<main>
  <section class="hero">
    <h1 id="heroTitle">Loading…</h1>
    <p id="heroTagline"></p>
  </section>

  <section id="books" aria-live="polite"></section>
</main>

<footer class="foot">
  <span>© <span id="year"></span> <span id="footName"></span></span>
  <span>Payments processed by Paynow</span>
</footer>

<div class="overlay" id="overlay" hidden>
  <div class="drawer" role="dialog" aria-modal="true">
    <button class="close" id="closeBtn" aria-label="Close">×</button>

    <div class="drawer-head">
      <div class="thumb" id="dThumb"></div>
      <div><h2 id="dTitle"></h2><p class="price" id="dPrice"></p></div>
    </div>
    <p class="drawer-desc" id="dDesc"></p>

    <div id="stepForm">
      <label>Email address<input id="fEmail" type="email" autocomplete="email"><small>Your PDF is delivered here as a backup copy.</small></label>
      <label>EcoCash number<input id="fPhone" type="tel" inputmode="numeric" placeholder="0771234567"></label>
      <p class="error" id="formError" hidden></p>
      <button class="btn primary full" id="payBtn">Pay with EcoCash</button>
      <p class="fine">You'll get a prompt on your phone. Enter your PIN to approve.</p>
    </div>

    <div id="stepWait" hidden>
      <div class="status"><span class="dot"></span>
        <div><p class="status-title">Waiting for your approval</p>
          <p class="muted" id="waitMsg"></p>
          <p class="muted">Order <span class="mono" id="waitRef"></span></p></div>
      </div>
    </div>

    <div id="stepDone" hidden>
      <p class="status-title ok">Your download is ready</p>
      <p class="muted">Order <span class="mono" id="doneRef"></span>. We've also emailed a backup copy to <span id="doneEmail"></span>.</p>
      <a class="btn primary full" id="downloadLink" style="margin-top:22px" download>Download your PDF</a>
      <p class="fine" id="previewWrap" hidden><a id="previewLink" target="_blank" rel="noopener">Open test email preview</a></p>
      <button class="btn ghost full" id="doneBtn" style="margin-top:12px">Close</button>
    </div>

    <div id="stepFail" hidden>
      <p class="status-title">Payment not completed</p>
      <p class="muted" id="failMsg"></p>
      <button class="btn primary full" id="retryBtn" style="margin-top:22px">Try again</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
